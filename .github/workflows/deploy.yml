# GradGrid — optional deploy workflow template
# Enable when you have a deployment target (DigitalOcean Droplet, AWS EC2, etc.)
#
# Required secrets:
#   DEPLOY_HOST     — SSH hostname or IP
#   DEPLOY_USER     — SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY  — Private key for SSH
#   DEPLOY_PATH     — App directory on server (e.g. /opt/gradgrid)

name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,.env.example,infra/,backend/,frontend/,Makefile"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull || true
            docker compose up -d --build
            docker compose ps
